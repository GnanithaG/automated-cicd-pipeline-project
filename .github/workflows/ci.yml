name: CI validation
on:
  pull_request:
  push:
    branches: [main]

jobs:
  java:
    strategy:
      matrix:
        java: [17, 21]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B clean verify
        working-directory: java-order-service

  python:
    strategy:
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python-risk-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: python-risk-service
      - run: ruff check . && ruff format --check .
        working-directory: python-risk-service
      - run: mypy app
        working-directory: python-risk-service
      - run: pytest
        working-directory: python-risk-service

  containers:
    runs-on: ubuntu-latest
    needs: [java, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
